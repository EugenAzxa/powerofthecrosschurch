<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Сила Креста</title>
<meta name="description" content="Приложение церкви «Сила Креста»: расписание, проповеди, отметка о посещении и пожертвования.">
<meta name="theme-color" content="#F4F7FB">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/app.css?v=8fcc1c04">
<script>
(function(){try{var q=new URLSearchParams(location.search).get('lang');
var s=q||localStorage.getItem('pocc-lang')||'ru';
document.documentElement.lang=(s==='en'?'en':'ru');}catch(e){}})();
</script>
</head>
<body>
<div class="app">

  <header class="bar">
    <svg class="bar-mark" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="am" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2F7FE8"/><stop offset="1" stop-color="#0E47A0"/></linearGradient></defs><path d="M13 2h6v9h9v6h-9v13h-6V17H4v-6h9V2z" fill="url(#am)"/></svg>
    <span class="bar-name" data-i18n="app.name"></span>
    <span class="bar-badge" data-i18n="app.demo.badge"></span>
  </header>

  <div class="screens" id="screens">

    <!-- HOME -->
    <section class="screen is-on" id="s-home">
      <div class="hero-card">
        <p class="greet" id="greet"></p>
        <p class="lbl" data-i18n="app.next"></p>
        <p class="svc" data-i18n="times.sun.name"></p>
        <p class="when"><span data-i18n="times.sun.day"></span>, <span data-i18n="times.sun.hour"></span></p>
        <p class="countdown"><b id="cdNum"></b><span id="cdWord"></span></p>
      </div>

      <div class="checkin" id="checkin">
        <div id="ciAsk">
          <h3 data-i18n="app.checkin.h"></h3>
          <p data-i18n="app.checkin.p"></p>
          <button class="btn btn-primary" type="button" id="ciBtn" style="margin-top:.6rem">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="app.checkin.btn"></span></button>
        </div>
        <div id="ciDone" hidden>
          <div class="done-row">
            <span class="done-tick"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <strong data-i18n="app.checkin.done"></strong>
          </div>
          <button class="link-btn" type="button" id="ciUndo" data-i18n="app.checkin.undo"></button>
        </div>
      </div>

      <div class="tiles"><button class="tile" type="button" data-go="listen"><span class="tile-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5-11-6.5z" fill="currentColor"/></svg></span><span data-i18n="app.q.listen"></span></button><button class="tile" type="button" data-go="program"><span class="tile-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg></span><span data-i18n="app.q.program"></span></button><button class="tile" type="button" data-go="give"><span class="tile-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7.4-4.7-7.4-9.6A4.4 4.4 0 0 1 12 8.2a4.4 4.4 0 0 1 7.4 2.2C19.4 15.3 12 20 12 20z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/></svg></span><span data-i18n="app.q.give"></span></button><button class="tile" type="button" data-go="route"><span class="tile-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11z" stroke="currentColor" stroke-width="1.8" fill="none"/><circle cx="12" cy="10" r="2.5" stroke="currentColor" stroke-width="1.8" fill="none"/></svg></span><span data-i18n="app.q.route"></span></button></div>

      <div class="verse-card">
        <p data-i18n="hero.verse"></p>
        <cite data-i18n="hero.verse.ref"></cite>
      </div>
    </section>

    <!-- LISTEN -->
    <section class="screen" id="s-listen">
      <h1 data-i18n="app.listen.h"></h1>
      <p data-i18n="app.listen.p"></p>
      <div class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
        <input type="search" id="aSearch" autocomplete="off" data-i18n-attr="placeholder:app.listen.search|aria-label:app.listen.search">
      </div>
      <div class="rows" id="aList"></div>
      <p class="note" id="aNone" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="app.listen.none"></span></p>
    </section>

    <!-- PROGRAM -->
    <section class="screen" id="s-program">
      <h1 data-i18n="app.program.h"></h1>
      <p class="sect" data-i18n="app.program.week"></p>
      <div class="rows"><div class="row"><span class="row-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg></span><span><span class="row-t" data-i18n="times.sun.name"></span><span class="row-s" data-i18n="times.sun.day"></span></span><span class="row-x" data-i18n="times.sun.hour"></span></div><div class="row"><span class="row-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg></span><span><span class="row-t" data-i18n="times.wed.name"></span><span class="row-s" data-i18n="times.wed.day"></span></span><span class="row-x" data-i18n="times.wed.hour"></span></div><div class="row"><span class="row-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg></span><span><span class="row-t" data-i18n="times.fri.name"></span><span class="row-s" data-i18n="times.fri.day"></span></span><span class="row-x" data-i18n="times.fri.hour"></span></div></div>
      <p class="sect" data-i18n="app.program.soon"></p>
      <div class="rows"><div class="row"><span class="row-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l8.5 15H3.5L12 4z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M12 9v10M8 19l4-6 4 6" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/></svg></span><span><span class="row-t" data-i18n="app.program.camp"></span><span class="row-s" data-i18n="app.program.campd"></span></span><span class="row-x"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div><div class="row"><span class="row-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M2.8 20a6.4 6.4 0 0 1 12.4 0M17 11.2a3.2 3.2 0 0 0 0-6.3" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg></span><span><span class="row-t" data-i18n="app.program.school"></span><span class="row-s" data-i18n="app.program.schoold"></span></span><span class="row-x"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div></div>
    </section>

    <!-- GIVE -->
    <section class="screen" id="s-give">
      <h1 data-i18n="app.give.h"></h1>
      <p data-i18n="app.give.p"></p>
      <div class="segs" role="group">
        <button class="seg" type="button" data-method="card" aria-pressed="true" data-i18n="app.give.card"></button>
        <button class="seg" type="button" data-method="etr" aria-pressed="false" data-i18n="app.give.etr"></button>
      </div>
      <div class="amts" id="aAmts">
        <button class="amt" type="button" aria-pressed="false">$25</button>
        <button class="amt" type="button" aria-pressed="true">$50</button>
        <button class="amt" type="button" aria-pressed="false">$100</button>
        <button class="amt" type="button" aria-pressed="false">$250</button>
        <button class="amt" type="button" aria-pressed="false">$500</button>
        <button class="amt" type="button" data-i18n="app.give.other"></button>
      </div>
      <button class="btn btn-blue" type="button" id="aGive">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7.4-4.7-7.4-9.6A4.4 4.4 0 0 1 12 8.2a4.4 4.4 0 0 1 7.4 2.2C19.4 15.3 12 20 12 20z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/></svg><span data-i18n="app.give.btn"></span></button>
      <p class="note"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="app.give.demo"></span></p>
    </section>

    <!-- MORE -->
    <section class="screen" id="s-more">
      <h1 data-i18n="app.more.h"></h1>
      <div class="rows"><a class="row" href="https://www.google.com/maps/dir/?api=1&amp;destination=255+Wildcat+Rd,+Toronto,+ON+M3J+2S3" target="_blank" rel="noopener"><span class="row-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11z" stroke="currentColor" stroke-width="1.8" fill="none"/><circle cx="12" cy="10" r="2.5" stroke="currentColor" stroke-width="1.8" fill="none"/></svg></span><span><span class="row-t" data-i18n="app.more.route"></span></span><span class="row-x"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a><a class="row" href="call.html"><span class="row-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21c-4.4 0-8-3.2-8-7.2V7.6a1.6 1.6 0 0 1 3.2 0v3.6M20 13.8V7.6a1.6 1.6 0 0 0-3.2 0v3.6M9.6 11.2V4.6a1.6 1.6 0 0 1 3.2 0v6M14.4 11.2v-5a1.6 1.6 0 0 1 3.2 0v5" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round"/></svg></span><span><span class="row-t" data-i18n="call.crumb"></span><span class="row-s" data-i18n="call.free"></span></span><span class="row-x"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a><a class="row" href="tel:+14168589317"><span class="row-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 3h3l1.5 5-2.2 1.6a13 13 0 0 0 6.6 6.6L17 14l5 1.5v3a2 2 0 0 1-2.2 2A17.5 17.5 0 0 1 3.5 5.2 2 2 0 0 1 5.5 3z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/></svg></span><span><span class="row-t" data-i18n="app.more.call"></span></span><span class="row-x"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a><a class="row" href="beliefs.html"><span class="row-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5S10 4 5.5 4H3v14h2.5C10 18 12 20.5 12 20.5S14 18 18.5 18H21V4h-2.5C14 4 12 6.5 12 6.5zM12 6.5v14" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/></svg></span><span><span class="row-t" data-i18n="app.more.beliefs"></span></span><span class="row-x"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a><a class="row" href="gallery.html"><span class="row-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M3.5 16l5-4.5 4 3.5 3-2.5 5 4" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/></svg></span><span><span class="row-t" data-i18n="app.more.gallery"></span></span><span class="row-x"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a><a class="row" href="index.html"><span class="row-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18z" stroke="currentColor" stroke-width="1.8" fill="none"/></svg></span><span><span class="row-t" data-i18n="app.more.site"></span></span><span class="row-x"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a></div>
      <p class="sect" data-i18n="app.more.lang"></p>
      <div class="segs" role="group">
        <button class="seg" type="button" data-lang="ru" aria-pressed="true">Русский</button>
        <button class="seg" type="button" data-lang="en" aria-pressed="false">English</button>
      </div>
      <p class="note" style="margin-top:1.2rem"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span><span data-i18n="visit.addr.v"></span></span></p>
    </section>

  </div>

  <div class="player" id="player">
    <div class="player-frame"><iframe id="pFrame" src="" title="" allow="autoplay; encrypted-media" allowfullscreen></iframe></div>
    <div class="player-bar">
      <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="player-meta"><strong id="pTitle"></strong><span id="pSub"></span></span>
      <button class="player-close" type="button" id="pClose" data-i18n-attr="aria-label:serm.close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg></button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <nav class="tabs" role="tablist"><button class="tab" type="button" role="tab" data-screen="home" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 9.5V20h13V9.5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/></svg><span data-i18n="app.tab.home"></span></button><button class="tab" type="button" role="tab" data-screen="listen" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5-11-6.5z" fill="currentColor"/></svg><span data-i18n="app.tab.listen"></span></button><button class="tab" type="button" role="tab" data-screen="program" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg><span data-i18n="app.tab.program"></span></button><button class="tab" type="button" role="tab" data-screen="give" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7.4-4.7-7.4-9.6A4.4 4.4 0 0 1 12 8.2a4.4 4.4 0 0 1 7.4 2.2C19.4 15.3 12 20 12 20z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/></svg><span data-i18n="app.tab.give"></span></button><button class="tab" type="button" role="tab" data-screen="more" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.7" fill="currentColor"/><circle cx="12" cy="12" r="1.7" fill="currentColor"/><circle cx="19" cy="12" r="1.7" fill="currentColor"/></svg><span data-i18n="app.tab.more"></span></button></nav>
</div>
